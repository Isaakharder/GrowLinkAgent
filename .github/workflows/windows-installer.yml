# Builds the per-user installers on Windows and tests install / upgrade / rollback /
# uninstall on a real Windows machine. No secrets are used.
name: Windows installer

on:
  push:
    branches: [ "feature/plants-climate-upload" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Unit tests (Windows, incl. DPAPI and single instance)
        run: |
          dotnet test GrowLinkAgent.Tests/GrowLinkAgent.Tests.csproj -c Release --logger "trx;LogFileName=windows-tests.trx" --results-directory test-results
          dotnet test GrowLinkAgent.CoreTests/GrowLinkAgent.CoreTests.csproj -c Release --logger "trx;LogFileName=core-tests.trx" --results-directory test-results

      - name: Publish 1.1.0
        run: dotnet publish GrowLinkAgent.csproj -c Release -o publish

      - name: Build 1.1.0 installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DAppVersion=1.1.0 /DSourceDir=publish /DOutputDir=installer GrowLinkAgent.iss
          Get-ChildItem installer

      - name: Build 1.0.1 (from tag v1.0.1) — original installer and rollback installer
        shell: pwsh
        run: |
          git worktree add v101 v1.0.1
          dotnet publish v101/GrowLinkAgent.csproj -c Release -o publish-1.0.1
          # The original 1.0.x script as released (only its hard-coded build paths changed),
          # to install the old version exactly as the live agent was installed.
          $orig = Get-Content v101/GrowLinkAgent.iss -Raw
          $orig = $orig -replace '#define SourceDir\s+".*"', '#define SourceDir "..\publish-1.0.1"' -replace 'OutputDir=.*', 'OutputDir=..\installer-legacy' -replace 'OutputBaseFilename=.*', 'OutputBaseFilename=GrowLinkAgent-1.0.1-original-Setup'
          Set-Content v101/GrowLinkAgent-original.iss $orig
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q v101/GrowLinkAgent-original.iss
          # Rollback installer: the 1.0.1 program packaged with the new per-user script.
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DAppVersion=1.0.1 /DSourceDir=publish-1.0.1 /DOutputDir=installer GrowLinkAgent.iss
          Get-ChildItem installer, installer-legacy

      - name: Install / upgrade / rollback / uninstall tests
        shell: pwsh
        run: ./tools/installer-test.ps1 -New installer/GrowLinkAgent-1.1.0-Setup.exe -Rollback installer/GrowLinkAgent-1.0.1-Setup.exe -Original installer-legacy/GrowLinkAgent-1.0.1-original-Setup.exe -Out test-results

      - name: Standard (non-administrator) user install
        shell: pwsh
        continue-on-error: true
        run: ./tools/installer-test-standard-user.ps1 -New installer/GrowLinkAgent-1.1.0-Setup.exe -Out test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growlinkagent-installers-and-results
          path: |
            installer/*.exe
            test-results/**
